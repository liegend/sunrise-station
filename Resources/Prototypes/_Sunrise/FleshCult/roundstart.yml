- type: entity
  id: FleshCult
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 40
  - type: FleshCultRule
    faction: Flesh
  - type: AntagObjectives
    objectives:
    - CreateFleshHeartObjective
    - FleshCultSurviveObjective
  - type: AntagSelection
    agentName: flesh-cult-round-end-agent-name
    definitions:
    - prefRoles: [ FleshCultistLeader ]
      fallbackRoles: [ FleshCultist ]
      max: 1
      startingGear: FleshCultistLeaderGear
      components:
      - type: FleshCultist
        startingMutationPoints: 15
      - type: NpcFactionMember
        factions:
        - FleshHuman
      whitelist:
        species:
          - Human
          - Reptilian
          - Dwarf
          - Vulpkanin
          - Felinid
          - Moth
          - Arachnid
          - Swine
          - Demon
          - Vox
          - Tajaran
      blacklist:
        components:
        - AntagImmune
        - Reactive
        - BibleUser
      mindRoles:
      - MindRoleFleshCultistLeader
    - prefRoles: [ FleshCultist ]
      fallbackRoles: [ FleshCultistLeader ]
      max: 3
      playerRatio: 15
      components:
      - type: FleshCultist
        startingMutationPoints: 5
      - type: NpcFactionMember
        factions:
        - FleshHuman
      whitelist:
        species:
        - Human
        - Reptilian
        - Dwarf
        - Vulpkanin
        - Felinid
        - Moth
        - Arachnid
        - Swine
        - Demon
        - Vox
        - Tajaran
      blacklist:
        components:
        - AntagImmune
        - Reactive
        - BibleUser
      mindRoles:
      - MindRoleFleshCultist
    selectionTime: JobsAssigned
    antags:
    - !type:FixedAntagCount
      proto: SunriseFleshCultistLeader
    - !type:LinearAntagCount
      proto: SunriseFleshCultist
      playerRatio: 15
      range:
        min: 1
        max: 3

- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: SunriseFleshCultistLeader
  prefRoles: [ FleshCultistLeader ]
  fallbackRoles: [ FleshCultist ]
  startingGear: FleshCultistLeaderGear
  components:
  - type: FleshCultist
    startingMutationPoints: 15
  - type: NpcFactionMember
    factions:
    - FleshHuman
  whitelist:
    species:
    - Human
    - Reptilian
    - Dwarf
    - Vulpkanin
    - Felinid
    - Moth
    - Arachnid
    - Swine
    - Demon
    - Vox
    - Tajaran
  blacklist:
    components:
    - Reactive
    - BibleUser
  mindRoles:
  - MindRoleFleshCultistLeader

- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: SunriseFleshCultist
  prefRoles: [ FleshCultist ]
  fallbackRoles: [ FleshCultistLeader ]
  components:
  - type: FleshCultist
    startingMutationPoints: 5
  - type: NpcFactionMember
    factions:
    - FleshHuman
  whitelist:
    species:
    - Human
    - Reptilian
    - Dwarf
    - Vulpkanin
    - Felinid
    - Moth
    - Arachnid
    - Swine
    - Demon
    - Vox
    - Tajaran
  blacklist:
    components:
    - Reactive
    - BibleUser
  mindRoles:
  - MindRoleFleshCultist
